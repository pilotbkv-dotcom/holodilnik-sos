  function districtRows(query){const list=districts.filter(x=>x.toLocaleLowerCase('ru').includes((query||'').trim().toLocaleLowerCase('ru')));return (list.length?list.map(x=>'<button class="listrow" type="button" data-district="'+esc(x)+'">'+x+icon('chevron_right')+'</button>').join(''):'<div class="small-note">Не нашли район? Выберите «Не знаю район» — мастер уточнит.</div>')+'<button class="listrow" type="button" data-district="region">Ленинградская область'+icon('chevron_right')+'</button><button class="listrow" type="button" data-district="unknown">Не знаю район'+icon('chevron_right')+'</button>';}

  // Маска показывает только введённые человеком цифры. Код +7 НЕ добавляем автоматически.
  // +79991881411 -> +7(999)188-14-11; 89991881411 -> 8(999)188-14-11;
  // 9991881411 -> (999)188-14-11. В e164() нормализация выполняется при отправке.
  function formatPhone(str){
    let d=String(str||'').replace(/\D/g,'');if(!d)return '';
    let prefix='',x='';
    if(d[0]==='7'||d[0]==='8'){
      prefix=d[0]==='7'?'+7':'8';x=d.slice(1,11);
    }else{x=d.slice(0,10);}
    if(!x)return prefix;
    return prefix+'('+x.slice(0,3)+(x.length>=3?')':'')+
      (x.length>3?x.slice(3,6):'')+(x.length>6?'-'+x.slice(6,8):'')+
      (x.length>8?'-'+x.slice(8,10):'');
  }
  function phoneCursorAfterDigits(formatted,digitCount){
    if(digitCount<=0)return 0;
    let n=0;for(let i=0;i<formatted.length;i++)if(/\d/.test(formatted[i])&&++n>=digitCount)return i+1;
    return formatted.length;
  }
  function handlePhoneInput(el){
    const caret=el.selectionStart==null?el.value.length:el.selectionStart;
    const before=el.value.slice(0,caret).replace(/\D/g,'').length;
    const formatted=formatPhone(el.value);
    el.value=formatted;data.phone=formatted;data.phone_source='manual';
    const pos=phoneCursorAfterDigits(formatted,before);
    try{el.setSelectionRange(pos,pos);}catch(_){}
  }
  // При Backspace рядом со скобкой/дефисом удаляем настоящую цифру, а не только разделитель.
  function deletePhoneNearSeparator(e){
    const el=e.target;if(el.id!=='client-phone'||!['deleteContentBackward','deleteContentForward'].includes(e.inputType))return;
    const a=el.selectionStart,b=el.selectionEnd,v=el.value;if(a==null||a!==b)return;
    const backward=e.inputType==='deleteContentBackward';
    const pivot=backward?a-1:a;
    if(pivot<0||pivot>=v.length||/\d/.test(v[pivot]))return;
    let pos=backward?pivot-1:pivot+1;
    while(pos>=0&&pos<v.length&&!/\d/.test(v[pos]))pos+=backward?-1:1;
    if(pos<0||pos>=v.length)return;
    e.preventDefault();
    const before=v.slice(0,pos).replace(/\D/g,'').length;
    const next=formatPhone(v.slice(0,pos)+v.slice(pos+1));
    el.value=next;data.phone=next;data.phone_source='manual';
    const caretNext=phoneCursorAfterDigits(next,before);
    try{el.setSelectionRange(caretNext,caretNext);}catch(_){}
    saveDraft();
  }
  function e164(s){let x=String(s||'').replace(/\D/g,'');if(x.length===10)x='7'+x;if(x.length===11&&x[0]==='8')x='7'+x.slice(1);return /^7\d{10}$/.test(x)?'+'+x:'';}

  // IndexedDB сохраняет необязательные фото отдельно: localStorage обычно ограничен 5 МБ.
  function photoDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('IndexedDB недоступна'));const req=indexedDB.open('holodilnik_sos_photos',1);req.onupgradeneeded=()=>req.result.createObjectStore('drafts');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  async function storePhotos(){try{const db=await photoDb();const tx=db.transaction('drafts','readwrite');tx.objectStore('drafts').put(data.photos.slice(),data.idempotency_key);tx.oncomplete=()=>db.close();tx.onerror=()=>db.close();}catch(_){/* фото необязательны */}}
  async function restorePhotos(){try{const db=await photoDb();const key=data.idempotency_key;const images=await new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readonly');const rq=tx.objectStore('drafts').get(key);rq.onsuccess=()=>resolve(rq.result||[]);rq.onerror=()=>reject(rq.error);});db.close();if(key===data.idempotency_key&&Array.isArray(images)&&!data.request_id){data.photos=images.filter(s=>typeof s==='string'&&s.startsWith('data:image/jpeg;base64,')).slice(0,3);if(data.screen==='details')render();}}catch(_){}}
  async function clearPhotos(key){try{const db=await photoDb();const tx=db.transaction('drafts','readwrite');tx.objectStore('drafts').delete(key);tx.oncomplete=()=>db.close();}catch(_){}}
  async function refreshStatus(){
    if(!data.request_id||statusPollBusy)return false;
    statusPollBusy=true;
    try{
      const r=await jsonpStatus(data.idempotency_key,7000);
      if(!r||!r.found||r.request_id!==data.request_id)return false;
      const oldStatus=data.status, oldDelivery=data.notification_delivery_status;
      data.status=r.status||data.status;
      data.notification_delivery_status=r.notification_delivery_status||data.notification_delivery_status;
      referralInviteCode=r.invite_code||referralInviteCode;
      if(data.notification_delivery_status!=='pending')statusPollTimedOut=false;
      if(data.screen==='success'&&(oldStatus!==data.status||oldDelivery!==data.notification_delivery_status))render();
      saveDraft();return true;
    }catch(err){console.warn('Проверка доставки:',err.message);return false;}
    finally{statusPollBusy=false;}
  }
  function scheduleStatusPoll(delay=4500){
    clearTimeout(statusPollTimer);
    if(!data.request_id||data.screen!=='success'||data.notification_delivery_status!=='pending')return;
    if(!statusPollSince)statusPollSince=Date.now();
    if(Date.now()-statusPollSince>=120000){
      if(!statusPollTimedOut){statusPollTimedOut=true;render();}
      return;
    }
    statusPollTimer=setTimeout(async()=>{
      statusPollTimer=0;
      if(document.hidden){scheduleStatusPoll(5500);return;}
      await refreshStatus();
      if(data.notification_delivery_status==='pending')scheduleStatusPoll(5500);
    },delay);
  }
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&data.screen==='success'&&data.request_id){
      refreshStatus().then(()=>{if(data.notification_delivery_status==='pending')scheduleStatusPoll(4500);});
    }
  });
